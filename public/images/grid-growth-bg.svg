<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="lines" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#074b6a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5a3" stop-opacity="0.25"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="url(#lines)" stroke-width="1">
    <!-- vertical lines -->
    <g>
      <path d="M50,0 l0,900"/>
      <path d="M150,0 l0,900"/>
      <path d="M250,0 l0,900"/>
      <path d="M350,0 l0,900"/>
      <path d="M450,0 l0,900"/>
      <path d="M550,0 l0,900"/>
      <path d="M650,0 l0,900"/>
      <path d="M750,0 l0,900"/>
      <path d="M850,0 l0,900"/>
      <path d="M950,0 l0,900"/>
      <path d="M1050,0 l0,900"/>
      <path d="M1150,0 l0,900"/>
      <path d="M1250,0 l0,900"/>
      <path d="M1350,0 l0,900"/>
      <path d="M1450,0 l0,900"/>
    </g>
    <!-- horizontal lines -->
    <g>
      <path d="M0,50 l1600,0"/>
      <path d="M0,150 l1600,0"/>
      <path d="M0,250 l1600,0"/>
      <path d="M0,350 l1600,0"/>
      <path d="M0,450 l1600,0"/>
      <path d="M0,550 l1600,0"/>
      <path d="M0,650 l1600,0"/>
      <path d="M0,750 l1600,0"/>
      <path d="M0,850 l1600,0"/>
    </g>
  </g>
  <!-- subtle glow dots -->
  <g fill="#fbbf24" opacity="0.25">
    <circle cx="140" cy="220" r="2"/>
    <circle cx="380" cy="120" r="2"/>
    <circle cx="520" cy="460" r="2"/>
    <circle cx="820" cy="200" r="2"/>
    <circle cx="1180" cy="360" r="2"/>
    <circle cx="1320" cy="180" r="2"/>
    <circle cx="1480" cy="420" r="2"/>
    <circle cx="260" cy="560" r="2"/>
    <circle cx="760" cy="640" r="2"/>
  </g>
</svg>